[workspace]
resolver = "3"
members = ["crates/mnote-core", "crates/mnote-vim", "crates/mnote-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
mnote-core = { path = "crates/mnote-core" }
mnote-vim = { path = "crates/mnote-vim" }
# notify: the file watcher behind live reload of notes changed outside mNote (FSEvents on macOS).
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"] }
# ropey: the text buffer. O(log n) edits and line lookups on any note size.
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
# tree-sitter + tree-sitter-md: incremental Markdown parsing for structure (headings, lists,
# code fences) and source-view highlighting. Grammars only, no bundled parser wrapper.
tree-sitter = "0.27.1"
tree-sitter-md = { version = "0.5.4", default-features = false }
# async-channel: carries file-watcher events to the UI thread. Already in gpui's tree.
async-channel = "2.5.0"
gpui = { version = "0.2.2", default-features = false, features = ["font-kit"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
# Line tables are enough for backtraces and keep gpui debug builds a fraction of the size.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
