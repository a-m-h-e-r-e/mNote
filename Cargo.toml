[workspace]
resolver = "3"
members = ["crates/mnote-core", "crates/mnote-vim", "crates/mnote-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# objc + raw-window-handle: reach the NSWindow behind a gpui window to set its
# Space behaviour (AMI-173). Both are already in gpui's tree at these versions,
# so they add no crates and no size.
objc = "0.2.7"
raw-window-handle = "0.6.2"
mnote-core = { path = "crates/mnote-core" }
mnote-vim = { path = "crates/mnote-vim" }
# notify: the file watcher behind live reload of notes changed outside mNote (FSEvents on macOS).
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"] }
# ropey: the text buffer. O(log n) edits and line lookups on any note size.
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
# tree-sitter + tree-sitter-md: incremental Markdown parsing for structure (headings, lists,
# code fences) and source-view highlighting. Grammars only, no bundled parser wrapper.
tree-sitter = "0.27.1"
tree-sitter-md = { version = "0.5.4", default-features = false }
# Grammars for coloring code blocks in the styled view: a short list of common
# languages; others show plain. Grammars only (no bundled parser wrappers).
tree-sitter-rust = { version = "=0.24.2", default-features = false }
tree-sitter-python = { version = "=0.25.0", default-features = false }
tree-sitter-javascript = { version = "=0.25.0", default-features = false }
tree-sitter-typescript = { version = "=0.23.2", default-features = false }
tree-sitter-bash = { version = "=0.25.1", default-features = false }
tree-sitter-json = { version = "=0.24.8", default-features = false }
# regex: Vim search patterns and :s, and full-text note search. Already in the tree
# through tree-sitter and gpui.
regex = { version = "1.13.2", default-features = false, features = ["std", "perf", "unicode"] }
# nucleo-matcher: the fuzzy matcher of nucleo (Helix), for the finder and pickers.
# Only the matcher: nucleo's own threading isn't needed. Needs memchr, already locked.
nucleo-matcher = { version = "0.3.1", default-features = false, features = ["unicode-normalization", "unicode-casefold"] }
# async-channel: carries file-watcher events to the UI thread. Already in gpui's tree.
async-channel = "2.5.0"
gpui = { version = "0.2.2", default-features = false, features = ["font-kit"] }

[workspace.lints.rust]
# deny, not forbid, so the one macOS integration module can lift it (CLAUDE.md).
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
# Line tables are enough for backtraces and keep gpui debug builds a fraction of the size.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
